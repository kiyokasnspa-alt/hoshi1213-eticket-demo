<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>電子チケットのQRコードについて</title>
<style>
body{margin:0;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;background:#f6f3ec;color:#222;line-height:1.8;-webkit-text-size-adjust:100%}
.box{max-width:420px;margin:0 auto;padding:36px 22px}
.mark{width:64px;height:64px;border-radius:50%;background:#c9a35a;color:#fff;font-size:40px;font-weight:800;line-height:64px;text-align:center;margin:0 auto 18px}
h1{font-size:18px;text-align:center;margin:0 0 20px;line-height:1.6}
p{font-size:15px;margin:0 0 14px}
.em{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px 16px;font-weight:700}
.staff{font-size:12px;color:#777;margin-top:28px;border-top:1px solid #ddd;padding-top:12px}
</style>
</head>
<body>
<!-- チケットのQRコードを、ふつうのカメラで読んだときに開くページ。ここからは受付しない（受付は、受付スタッフの読み取りページだけ）。2026-11-16 までは受付の記録先へ転送していた（控え work/redirect_backup_2026-11-16.html） -->
<div class="box">
  <div class="mark">!</div>
  <h1>このQRコードは、<br>会場の受付で読み取るためのものです</h1>
  <p class="em">お客様のスマートフォンのカメラで読み取っても、受付にはなりません。</p>
  <p>当日は、電子チケットの画面（QRコード）を、会場の受付でご提示ください。係員が読み取ります。</p>
  <p>電子チケットは、お受け取りになったURLからご覧いただけます。</p>
  <div class="staff">受付スタッフの方へ：受付は、専用の読み取りページで行ってください。</div>
</div>
</body>
</html>
